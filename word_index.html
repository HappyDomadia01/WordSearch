<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Game</title>
</xai:function_call name="edit_file">
<!-- <parameter name="path">WordSearch/word_index.html -->

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  
  <link rel="stylesheet" href="word_style.css">
</head>
<body>
  <canvas id="particlesCanvas" class="particles-canvas" aria-hidden="true"></canvas>
  <main class="app-shell">
    <section class="game-card">
      <header class="hero-block">
        <!-- <div>
<h1 class="game-title">Word Search</h1>
        </div> -->
        <div class="header-actions">
          <!-- <label class="select-wrap" for="difficultySelect">
            <span>Difficulty</span>
            <select id="difficultySelect">
              <option value="easy">Easy</option>
              <option value="medium" selected>Medium</option>
              <option value="hard">Hard</option>
            </select>
          </label> -->
            <label class="select-wrap" for="difficultySelect">
    <span>Difficulty</span>
    <select id="difficultySelect">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
  </label>
<!-- <button id="soundBtn" class="action-btn secondary" type="button" aria-pressed="true" title="Sound on - Click to turn off">🔊</button> -->
 <button id="soundBtn"
        class="action-btn secondary"
        type="button"
        aria-pressed="true"
        title="Sound on - Click to turn off">
  <i class="bi bi-volume-up-fill"></i>
</button>
          <!-- <button id="hintBtn" class="action-btn secondary" type="button">Hint</button> -->
          <button id="newGameBtn" class="action-btn primary" type="button">New Game</button>
        </div>
      </header>
      <section class="word-panel">
        <div class="panel-heading">
          <div>
            <!-- <h2>Target Words</h2> -->
            <p>Find all hidden words before the timer ends.</p>
          </div>
          <!-- <div class="progress-meta">
            <span id="progressLabel">0 / 0 Found</span>
          </div> -->
        </div>
        <div id="wordList" class="word-list"></div>
        <div class="progress-meta">
            <!-- <span id="progressLabel">0 / 0 Found</span>
          </div>
          <label class="select-wrap" for="difficultySelect">
            <span>Difficulty</span>
            <select id="difficultySelect">
              <option value="easy">Easy</option>
              <option value="medium" selected>Medium</option>
              <option value="hard">Hard</option>
            </select>
          </label> -->
          <div class="top-bar">
  <span id="progressLabel">0 / 6 Found</span>
   <button id="hintBtn" class="action-btn primary2" type="button">Hint</button>

  <!-- <label class="select-wrap" for="difficultySelect">
    <span>Difficulty</span>
    <select id="difficultySelect">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
  </label> -->
</div>
      </section>
      <section class="board-panel">
        <div id="selectionPreview" class="selection-preview">Drag to select a word</div>
        <div id="boardArea" class="board-area">
          <div id="selectionLine" class="selection-line" aria-hidden="true"></div>
          <div id="grid" class="word-grid" aria-label="Word finder grid"></div>
        </div>
        <!-- <div id="selectionPreview" class="selection-preview">Drag to select a word</div> -->
      </section>
      <section class="status-panel">
        <article class="status-card">
          <span class="status-label">Score</span>
          <strong id="scoreValue" class="status-value">0</strong>
        </article>
        <article class="status-card">
          <span class="status-label">Combo</span>
          <strong id="comboValue" class="status-value">x1</strong>
        </article>
        <article class="status-card">
          <span class="status-label">Timer</span>
          <strong id="timerValue" class="status-value">03:00</strong>
        </article>
        <article class="status-card">
          <span class="status-label">Hints</span>
          <strong id="hintValue" class="status-value">0</strong>
        </article>
      </section>
      <div id="toastMessage" class="toast-message" aria-live="polite"></div>
    </section>
  </main>
  <div id="gameOverModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop"></div>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="gameOverTitle">
      <h2 id="gameOverTitle">Game Over</h2>
      <p class="modal-copy">The timer has ended.</p>
      <div class="modal-stats">
        <div>
          <span>Final Score</span>
          <strong id="finalScore">0</strong>
        </div>
        <div>
          <span>Words Found</span>
          <strong id="finalWords">0 / 0</strong>
        </div>
      </div>
      <button id="retryBtn" class="action-btn primary modal-btn" type="button">Retry</button>
    </div>
  </div>
  <div id="completionModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop"></div>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="completionTitle">
      <h2 id="completionTitle">Congratulations!</h2>
      <p class="modal-copy">You completed the puzzle.</p>
      <button id="nextPuzzleBtn" class="action-btn primary modal-btn" type="button">Next</button>
    </div>
  </div>
  
  <script src="word_script.js"></script>
</body>
</html>
